# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/configuration-reference
version: 2.1

orbs:
  go: circleci/go@2.2.0

# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/jobs-steps/#jobs-overview & https://circleci.com/docs/configuration-reference/#jobs
jobs:
  build:
    docker:
      - image: cimg/go:1.24.2
    steps:
      - checkout
      - go/install-packages:
          pkg: ./...
      - run:
          name: Build
          command: go build -v ./...
      - run:
          name: Test
          command: go test -v ./...

  cmd-build:
    docker:
      - image: cimg/go:1.24.2
    steps:
      - checkout
      - go/install-packages:
          pkg: ./cmd/...
      - run:
          name: Build CMD
          command: |
            if [ -d "cmd" ]; then
              echo "Building cmd directory..."
              go build -v ./cmd/...
            else
              echo "No cmd directory found"
            fi

  configs-build:
    docker:
      - image: cimg/go:1.24.2
    steps:
      - checkout
      - go/install-packages:
          pkg: ./configs/...
      - run:
          name: Build Configs
          command: |
            if [ -d "configs" ]; then
              echo "Building configs directory..."
              go build -v ./configs/...
            else
              echo "No configs directory found"
            fi

# Orchestrate jobs using workflows
# See: https://circleci.com/docs/workflows/ & https://circleci.com/docs/configuration-reference/#workflows
workflows:
  version: 2
  build-and-test:
    jobs:
      - build:
          filters:
            branches:
              only: main
            paths:
              - "**.go"
              - "go.mod"
              - "go.sum"
      - cmd-build:
          filters:
            branches:
              only: main
            paths:
              - "cmd/**"
      - configs-build:
          filters:
            branches:
              only: main
            paths:
              - "configs/**"

              